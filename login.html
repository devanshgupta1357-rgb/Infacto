<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infacto - Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'headline-lg': ['Libre Caslon Text', 'serif'],
                        'body-lg': ['Work Sans', 'sans-serif'],
                        'body-md': ['Work Sans', 'sans-serif'],
                        'label-md': ['Work Sans', 'sans-serif'],
                        'display-lg': ['Libre Caslon Text', 'serif'],
                        'headline-sm': ['Libre Caslon Text', 'serif']
                    },
                    spacing: { 'container-max': '1280px' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col font-body-md antialiased">
    
    <!-- Generic Transparent Navigation Bar -->
    <nav class="fixed top-0 left-0 w-full z-50 flex items-center justify-end py-4 px-4 md:py-6 md:px-12 bg-transparent pointer-events-none">
        <div class="flex items-center pointer-events-auto drop-shadow-md">
            <a href="index.html" class="text-white/80 text-[11px] md:text-base font-medium hover:text-white transition-colors duration-200 font-body-lg flex items-center gap-1 md:gap-2 bg-black/60 px-3 md:px-4 py-1.5 md:py-2 rounded-full border border-white/10 backdrop-blur-sm uppercase tracking-wider">
                <span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
                Back to Site
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-6 py-24 z-10 relative">
        <div class="w-full max-w-md">
            <div class="text-center mb-12 flex flex-col justify-center items-center">
                <h1 class="font-display-lg text-5xl md:text-6xl text-white mb-6">Login</h1>
                <p class="font-headline-sm text-lg md:text-xl text-white/80 text-center mb-0 max-w-sm">Experience the thrill of Oxford Style debate at IIIT Nagpur.</p>
            </div>
            
            <form class="space-y-8" action="#" method="POST">
                <div class="border border-white/20 rounded-xl p-8 space-y-8 bg-white/5 shadow-2xl backdrop-blur-sm">
                    <div class="space-y-2">
                        <label class="block font-headline-sm text-xl text-white" for="id-input">Team Name</label>
                        <input class="w-full bg-transparent border-0 border-b-2 border-white/20 text-white font-body-lg text-lg py-3 px-0 focus:ring-0 focus:border-white transition-colors placeholder-white/30 rounded-none outline-none" id="id-input" placeholder="Enter Registration Team Name" type="text" required="">
                    </div>
                    
                    <div class="space-y-2 mt-8">
                        <label class="block font-headline-sm text-xl text-white" for="password-input">Password (Team ID)</label>
                        <input class="w-full bg-transparent border-0 border-b-2 border-white/20 text-white font-body-lg text-lg py-3 px-0 focus:ring-0 focus:border-white transition-colors placeholder-white/30 rounded-none outline-none" id="password-input" placeholder="Enter Team ID password" type="password" required="">
                    </div>
                </div>
                
                <div class="pt-8">
                    <button class="w-full bg-white text-black font-headline-sm text-lg py-4 px-8 rounded hover:bg-white/90 transition-colors uppercase tracking-wider flex items-center justify-center gap-2 group active:scale-[0.98] duration-200" type="submit">
                        Log In
                        <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
